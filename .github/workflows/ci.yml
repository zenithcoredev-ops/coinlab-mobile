name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # expo-env.d.ts is gitignored (Expo generates it on start); it pulls in
      # expo/types, which declares CSS module imports.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - run: npx tsc --noEmit
